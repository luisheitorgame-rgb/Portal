<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Portal Individual · Equipe 2 · Sete Povos das Missões</title>
<style>
:root{
  color-scheme:light;
  --rosa:#F0257A;--laranja:#FF6B00;--amarelo:#FFC300;--verde:#00A64F;--turquesa:#00B3C8;--azul:#1B62E0;
  --terracota:#C1502E;--marrom:#5E3A22;--tinta:#14110F;--papel:#F7F3EC;--cartao:#FFFDF7;--apagado:#DAD4C8;--meia:#8A8177;
  --display:"Avenir Next Condensed","Franklin Gothic Medium","Arial Narrow","Helvetica Neue",Helvetica,sans-serif;
  --texto:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.48 var(--texto)}
button,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--terracota);outline-offset:2px}[hidden]{display:none!important}
.wrap{max-width:1080px;margin:auto;padding:0 18px 52px}.faixa{display:flex;height:12px}.faixa i{flex:1}
.faixa.equipe i:nth-child(1){background:var(--rosa)}.faixa.equipe i:nth-child(2){background:var(--laranja)}.faixa.equipe i:nth-child(3){background:var(--amarelo)}
.faixa.equipe i:nth-child(4){background:var(--verde)}.faixa.equipe i:nth-child(5){background:var(--turquesa)}.faixa.equipe i:nth-child(6){background:var(--azul)}
.faixa.piquete i:nth-child(1){background:var(--verde)}.faixa.piquete i:nth-child(2){background:var(--terracota)}.faixa.piquete i:nth-child(3){background:var(--amarelo)}.faixa.piquete i:nth-child(4){background:var(--marrom)}
.faixa.fina{height:6px}.selo,.marca{display:block;width:100%;height:auto}
header{padding:30px 0 20px}.hero{display:flex;align-items:center;gap:16px}.hero .selo{width:72px;flex:none}
h1{margin:0;font:700 clamp(34px,7vw,62px)/.9 var(--display);text-transform:uppercase}.sub{margin:13px 0 10px;color:var(--meia);font:11px var(--display);letter-spacing:.15em;text-transform:uppercase}
.selector{margin:20px 0;border:2px solid var(--tinta);background:var(--cartao);padding:16px;box-shadow:6px 6px 0 var(--terracota)}
label,.eyebrow{display:block;margin:0 0 7px;color:var(--meia);font:700 10px var(--display);letter-spacing:.16em;text-transform:uppercase}
select{width:100%;min-height:48px;border:2px solid var(--tinta);border-radius:0;background:var(--papel);color:var(--tinta);padding:9px 12px}
.empty{border:2px dashed var(--apagado);background:var(--cartao);padding:22px}.empty strong{font:700 17px var(--display);text-transform:uppercase}.empty p{margin:5px 0 0;color:var(--meia)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--tinta);background:var(--cartao);margin:20px 0}
.quick article{padding:13px;border-left:1px solid var(--apagado);min-width:0}.quick article:first-child{border-left:0}
.quick b{display:block;color:var(--meia);font:700 9px var(--display);letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}.quick strong{display:block;font:700 17px/1.08 var(--display);overflow-wrap:anywhere}.quick p{margin:5px 0 0;font-size:13px;color:var(--meia)}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.tab{min-height:44px;white-space:nowrap;border:2px solid var(--tinta);background:var(--cartao);padding:9px 13px;font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--tinta);color:var(--papel)}.panel{border-top:2px solid var(--tinta);padding-top:20px}
.view-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:15px}.view-head h2{margin:0;font:700 18px var(--display);letter-spacing:.08em;text-transform:uppercase}.view-head span{color:var(--meia);font:10px var(--display);letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.stack{display:grid;gap:14px}
.card{background:var(--cartao);border:2px solid var(--tinta);padding:16px}.card.accent{box-shadow:6px 6px 0 var(--c)}
.card h3{margin:0;font:700 18px/1.05 var(--display);text-transform:uppercase}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--apagado);padding-bottom:10px;margin-bottom:11px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{display:inline-flex;border:1px solid var(--tinta);padding:3px 6px;background:var(--papel);font:9px var(--display);letter-spacing:.1em;text-transform:uppercase}
.tag.strong{background:var(--c);color:var(--on);border-color:var(--c)}.tag.warn{background:var(--terracota);color:#fff;border-color:var(--terracota)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px}.field{border-bottom:1px solid var(--apagado);padding-bottom:7px;min-width:0}.field.full{grid-column:1/-1}
.field b{display:block;color:var(--meia);font:9px var(--display);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}.field span{overflow-wrap:anywhere}
.action{margin:12px 0 0;border-left:5px solid var(--c);padding-left:11px}.action b{color:var(--meia);font:700 9px var(--display);letter-spacing:.15em;text-transform:uppercase}.action p{margin:3px 0 0}
details{margin-top:11px;border-top:1px solid var(--apagado);padding-top:9px}summary{cursor:pointer;font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase}
.detail{display:grid;gap:8px;margin-top:10px}.detail div{border-bottom:1px solid var(--apagado);padding-bottom:7px}.detail b{display:block;color:var(--meia);font:9px var(--display);letter-spacing:.13em;text-transform:uppercase}
.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}.list li{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--apagado);padding-bottom:8px}.list li:last-child{border-bottom:0}.list strong{font:700 13px var(--display);text-transform:uppercase}.list small{display:block;color:var(--meia);font-size:12px;margin-top:2px}
.pend{border-left:7px solid var(--terracota)}
/* Cartões individuais — estrutura do Sistema Visual */
.cartao-pessoa{background:var(--cartao);border:2px solid var(--tinta);display:flex;flex-direction:column;min-height:100%}
.cartao-pessoa .topo{background:var(--c);color:var(--on);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cartao-pessoa .topo b{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase}.selo-topo{width:28px;flex:none}
.cartao-pessoa .corpo{padding:18px 18px 0;flex:1}.papel-nome{padding:4px 0 15px;border-bottom:1px solid var(--apagado)}
.rotulo-papel{color:var(--c);font:700 26px/.9 var(--display);text-transform:uppercase}.papel-nucleo{margin:8px 0 0;color:var(--meia);font:11px var(--display);letter-spacing:.15em;text-transform:uppercase}.papel-nucleo b{color:var(--c)}
.nome-pessoa{margin-top:12px;font-weight:700;font-size:20px}.chamado{background:var(--c);color:var(--on);padding:14px 15px;margin:16px 0}
.rot{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--meia);font:700 10px var(--display);letter-spacing:.18em;text-transform:uppercase}.rot:before{content:"";width:9px;height:9px;background:var(--c);flex:none}.chamado .rot{color:inherit}.chamado .rot:before{background:currentColor}
.duo{display:grid;gap:8px}.duo div{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid currentColor;padding-bottom:6px}.duo div:last-child{border-bottom:0}.duo span{font:9px var(--display);letter-spacing:.12em;text-transform:uppercase;text-align:right}
.bloco{padding:14px 0;border-bottom:1px solid var(--apagado)}.bloco:last-child{border-bottom:0}.mini{list-style:none;padding:0;margin:0;display:grid;gap:8px}.mini li{border-bottom:1px solid var(--apagado);padding-bottom:7px}.mini li:last-child{border-bottom:0}.mini strong{display:block;font:700 13px var(--display);text-transform:uppercase}.mini small{display:block;color:var(--meia);font-size:12px;margin-top:2px}
.rodape-cartao{margin-top:auto;border-top:1px solid var(--apagado);padding:13px 18px 14px;color:var(--meia);font:9px var(--display);letter-spacing:.15em;text-transform:uppercase}
.team-flow{font:700 18px/1.25 var(--display);text-transform:uppercase}.war{font:700 30px/1 var(--display);text-transform:uppercase;color:var(--terracota);margin:0 0 16px}.war:last-child{margin-bottom:0}
@media(max-width:760px){.quick{grid-template-columns:1fr 1fr}.quick article:nth-child(3){border-left:0;border-top:1px solid var(--apagado)}.quick article:nth-child(4){border-top:1px solid var(--apagado)}.view-head{align-items:flex-start;flex-direction:column}.meta{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:520px){.wrap{padding-left:14px;padding-right:14px}.hero{align-items:flex-start}.hero .selo{width:58px}.quick{grid-template-columns:1fr}.quick article{border-left:0!important;border-top:1px solid var(--apagado)}.quick article:first-child{border-top:0}.grid{grid-template-columns:1fr}}
</style>
</head>

function exactListContains(list,name){return defined(list)&&String(list).split(",").map(x=>x.trim()).includes(name)}
function proofRoles(pr,p){
 const r=[];
 if(pr.responsavel===p.nome)r.push("Responsável");
 if(pr.substituto===p.nome)r.push("Substituto");
 if(exactListContains(pr.participantes,p.nome))r.push("Participante");
 if(pr.conferente===p.nome)r.push("Conferente");
 const ex=String(pr.exigencia||"").toLowerCase();
 if(pr.participantes==="Todos"||ex.includes("todos os integrantes")||ex.trim()==="equipe presente.")r.push("Equipe");
 return [...new Set(r)];
}
function personalProofs(p){return DATA.proofs.filter(pr=>proofRoles(pr,p).length)}
function taskBelongs(t,p){
 const r=String(t.responsavel||"");
 if(r.includes(p.nome))return true;
 if(r==="Central de operações"&&p.papel==="Central de operações")return true;
 if(r==="Capatazes"&&String(p.papel||"").startsWith("Capataz"))return true;
 return false;
}

const personalMats=p=>DATA.materials.filter(m=>m.traz===p.nome||m.transporta===p.nome);
const proofMats=(pr,p)=>personalMats(p).filter(m=>m.prova===pr.prova);
function personalShifts(p){return (DATA.turnos||[]).filter(s=>s.integranteQG===p.nome||s.reservaQG===p.nome)}
function shiftRole(s,p){return s.integranteQG===p.nome?"Titular no QG":(s.reservaQG===p.nome?"Reserva do QG":"")}
function marker(n){
 const a="#DAD4C8", colors={
  "N1 Artístico e palco":["#F0257A",a,a,a,a,a],
  "N2 Campo e competição":[a,"#FF6B00",a,a,a,a],
  "N3 Tradição campeira e conhecimento":[a,a,a,a,a,"#1B62E0"],
  "N4 Mídia e produção":[a,a,"#FFC300",a,a,a],
  "N5 QG, gastronomia e hospitalidade":[a,a,a,"#00A64F",a,a],
  "N6 Arrecadação e mobilização":[a,a,a,a,"#00B3C8",a]
 };
 const c=colors[n]||["#F0257A","#FF6B00","#FFC300","#00A64F","#00B3C8","#1B62E0"];
 return `<svg class="marca" viewBox="0 0 200 200" style="--b1:${c[0]};--b2:${c[1]};--b3:${c[2]};--b4:${c[3]};--b5:${c[4]};--b6:${c[5]}" aria-hidden="true"><use href="#marca"/></svg>`
}
function contactFor(p){
 const c=caps(), luis=c.find(x=>x.papel==="Capataz de operações");
 if(defined(p.chefe)&&p.chefe!=="—"&&p.chefe!=="Capatazes"&&p.chefe!=="sem coordenador"&&p.chefe!=="sem núcleo"){
   const q=person(p.chefe); return {title:p.chefe,detail:q?.contato||"Contato não definido"};
 }
 if(p.chefe==="Capatazes"||String(p.papel||"").startsWith("Coordenador")||p.papel==="Central de operações")
   return {title:"Capatazes",detail:c.map(x=>`${x.nome} · ${x.contato||"Contato não definido"}`).join(" / ")};
 if(p.chefe==="sem coordenador"||p.chefe==="sem núcleo") return {title:luis?.nome||"Capataz de operações",detail:luis?.contato||"Contato não definido"};
 if(String(p.papel||"").startsWith("Capataz")){
   const other=c.find(x=>x.nome!==p.nome); return {title:other?.nome||"Casal Capataz",detail:other?.contato||"Contato não definido"};
 }
 return {title:"Pendente",detail:"Contato não definido"};
}
function roleFooter(p){
 if(p.papel==="Coordenador")return "Só o que eu não resolvo chega aos capatazes.";
 if(p.papel==="Vice Coordenador")return "Se o coordenador falta, quem decide sou eu.";
 if(p.papel==="Integrante")return "Dúvida ou problema vai para o coordenador.";
 if(p.papel==="Central de operações")return "A Central registra, cobra confirmação e aponta conflitos.";
 if(p.papel==="Capataz de operações"||p.papel==="Capataz de desempenho")return "Decisão geral, Comissão, prioridades e conflitos.";
 return "Função pendente.";
}
function roleResponsibilities(p){
 if(p.papel==="Coordenador")return ["Distribuir o trabalho e definir responsáveis, substituto e conferente.","Acompanhar prazos e responder pelas entregas do núcleo.","Escalar aos capatazes somente o que o núcleo não consegue resolver."];
 if(p.papel==="Vice Coordenador")return ["Substituo o coordenador quando ele falta.","Ajudo no dia a dia do núcleo.","Quando eu assumo, respondo aos capatazes."];
 if(p.papel==="Integrante")return ["Executo as tarefas combinadas.","Confirmo presença e levo o material assumido.","Aviso imediatamente sobre atraso, falta ou impedimento."];
 if(p.papel==="Capataz de operações")return ["Fechar prioridades, escala, organização, dúvidas e conflitos.","Ser o ponto principal para dúvidas com a Comissão.","Decidir quando os núcleos não conseguem resolver."];
 if(p.papel==="Capataz de desempenho")return ["Auditar critérios e riscos de penalidade.","Conferir a prontidão das provas antes da liberação.","Apoiar as decisões gerais da equipe."];
 if(p.papel==="Central de operações")return ["Controlar avisos, horários, presença e confirmações.","Registrar mudanças, status e pontos aceitos.","Checar conflitos e acionar apoio móvel."];
 return [];
}
function nextAction(p,proofs,tasks){
 const open=tasks.find(t=>!["pronta","concluída","entregue"].includes(String(t.status||"").toLowerCase()));
 if(open)return {what:open.item,when:open.prazo?`Prazo interno: ${open.prazo}`:"Prazo: Pendente"};
 const sh=personalShifts(p)[0];
 if(sh)return {what:`${shiftRole(sh,p)} — cobertura do QG`,when:`${sh.dia} · ${sh.turno} · ${sh.horario}`};
 const pr=proofs[0];
 if(pr)return {what:pr.acao||pr.prova,when:`${pr.turno||"Pendente"} · ${pr.hora||"Pendente"}`};
 return {what:"Pendente",when:"Não definido"};
}
function quick(p,proofs,tasks,mats){
 const a=nextAction(p,proofs,tasks), ct=contactFor(p);
 const bring=mats.length?mats.slice(0,2).map(x=>x.item).join(" · ")+(mats.length>2?" · outros materiais atribuídos":""):"Não definido";
 $("#quick").innerHTML=[
  ["O que fazer",a.what,tasks.length?"Tarefa registrada":"Compromisso registrado"],
  ["Quando",a.when,"Prazo ou horário mais próximo registrado"],
  ["O que levar",bring,mats.length?"Sob sua responsabilidade":"Nenhum material atribuído a você"],
  ["A quem procurar",ct.title,ct.detail]
 ].map(x=>`<article><b>${esc(x[0])}</b><strong>${esc(x[1])}</strong><p>${esc(x[2])}</p></article>`).join("");
}
function miniTasks(tasks){
 if(!tasks.length)return `<li><strong>Pendente</strong><small>Nenhuma tarefa pessoal registrada.</small></li>`;
 return tasks.slice(0,3).map(t=>`<li><strong>${esc(t.item)}</strong><small>${t.prazo?`Prazo interno: ${esc(t.prazo)}`:"Prazo interno: Pendente"}</small></li>`).join("")+(tasks.length>3?`<li><strong>Outras tarefas</strong><small>Veja a aba Tarefas e materiais.</small></li>`:"");
}
function miniProofs(proofs){
 if(!proofs.length)return `<li><strong>Pendente</strong><small>Nenhuma prova ou compromisso atribuído.</small></li>`;
 return proofs.slice(0,3).map(pr=>`<li><strong>${esc(pr.prova)}</strong><small>${esc(pr.turno||"Pendente")} · ${esc(pr.hora||"Pendente")} · ${esc(proofRoles(pr,current).join(" / "))}</small></li>`).join("")+(proofs.length>3?`<li><strong>Outros compromissos</strong><small>Veja a aba Provas.</small></li>`:"");
}
let current=null;
function peopleList(n,exclude){
 const a=members(n).filter(x=>x.nome!==exclude);
 if(!a.length)return `<li><strong>Pendente</strong><small>Nenhuma pessoa registrada.</small></li>`;
 return a.map(x=>`<li><strong>${esc(x.nome)}</strong><small>${esc(x.papel||"Função pendente")}</small></li>`).join("");
}
function nucleusProofs(n){
 return DATA.proofs.filter(pr=>pr.nucleo===n&&pr.prova!=="Total");
}
function renderPersonalCard(p,proofs,tasks,mats){
 const m=meta(p.nucleo), c=coord(p.nucleo), v=vice(p.nucleo), ct=contactFor(p), resp=roleResponsibilities(p);
 let body="";
 if(p.papel==="Coordenador"){
   const ps=nucleusProofs(p.nucleo);
   body=`<div class="chamado"><div class="rot">A quem eu recorro</div><div class="duo">${caps().map(x=>`<div><strong>${esc(x.nome)}</strong><span>${esc(x.papel)}</span></div>`).join("")}</div></div>
   <div class="bloco"><div class="rot">Minhas três responsabilidades</div><ul class="mini">${resp.map(x=>`<li><strong>${esc(x)}</strong></li>`).join("")}</ul></div>
   <div class="bloco"><div class="rot">Meu vice</div><ul class="mini"><li><strong>${v?esc(v.nome):"Pendente"}</strong><small>${v?.contato?esc(v.contato):"Contato não definido"}</small></li></ul></div>
   <div class="bloco"><div class="rot">Minha equipe</div><ul class="mini">${peopleList(p.nucleo,p.nome)}</ul></div>
   <div class="bloco"><div class="rot">Provas sob minha responsabilidade</div><ul class="mini">${ps.map(pr=>`<li><strong>${esc(pr.prova)}</strong><small>Dono: ${show(pr.responsavel)} · Prazo interno: ${show(pr.prazo)}</small></li>`).join("")||`<li><strong>Pendente</strong></li>`}</ul></div>`;
 } else if(p.papel==="Vice Coordenador"){
   body=`<div class="chamado"><div class="rot">Quem eu substituo</div><div class="duo"><div><strong>${c?esc(c.nome):"Pendente"}</strong><span>Coordenador</span></div></div></div>
   <div class="bloco"><div class="rot">O que eu faço</div><ul class="mini">${resp.map(x=>`<li><strong>${esc(x)}</strong></li>`).join("")}</ul></div>
   <div class="bloco"><div class="rot">Minha equipe quando eu assumo</div><ul class="mini">${peopleList(p.nucleo,p.nome)}</ul></div>
   <div class="bloco"><div class="rot">Minhas provas</div><ul class="mini">${miniProofs(proofs)}</ul></div>`;
 } else if(p.papel==="Integrante"){
   body=`<div class="chamado"><div class="rot">Meu coordenador e vice</div><div class="duo"><div><strong>${c?esc(c.nome):"Pendente"}</strong><span>Coordenador</span></div><div><strong>${v?esc(v.nome):"Pendente"}</strong><span>Vice</span></div></div></div>
   <div class="bloco"><div class="rot">Minhas tarefas com prazo</div><ul class="mini">${miniTasks(tasks)}</ul></div>
   <div class="bloco"><div class="rot">Minhas provas</div><ul class="mini">${miniProofs(proofs)}</ul></div>
   <div class="bloco"><div class="rot">O que eu levo</div><ul class="mini">${mats.length?mats.map(x=>`<li><strong>${esc(x.item)}</strong><small>${esc(x.prova)} · ${esc(x.turno||"Pendente")}</small></li>`).join(""):`<li><strong>Não definido</strong><small>Nenhum material está atribuído ao seu nome.</small></li>`}</ul></div>`;
 } else {
   body=`<div class="chamado"><div class="rot">Contato para dúvidas</div><div class="duo"><div><strong>${esc(ct.title)}</strong><span>${esc(ct.detail)}</span></div></div></div>
   <div class="bloco"><div class="rot">Responsabilidades da função</div><ul class="mini">${resp.length?resp.map(x=>`<li><strong>${esc(x)}</strong></li>`).join(""):`<li><strong>Pendente</strong><small>Função não definida.</small></li>`}</ul></div>
   <div class="bloco"><div class="rot">Minhas tarefas</div><ul class="mini">${miniTasks(tasks)}</ul></div>
   <div class="bloco"><div class="rot">Minhas provas</div><ul class="mini">${miniProofs(proofs)}</ul></div>`;
 }
 return `<article class="cartao-pessoa" style="--c:${m.c};--on:${m.on}">
 <div class="topo"><b>${show(p.nucleo)}</b><span class="selo-topo">${marker(p.nucleo)}</span></div>
 <div class="corpo"><div class="papel-nome"><div class="rotulo-papel">${show(p.papel)}</div><p class="papel-nucleo">Núcleo <b>${show(p.nucleo)}</b></p><div class="nome-pessoa">${esc(p.nome)}</div></div>${body}</div>
 <p class="rodape-cartao">${esc(roleFooter(p))}</p><div class="faixa equipe fina"><i></i><i></i><i></i><i></i><i></i><i></i></div></article>`;
}
function renderCardTab(p,proofs,tasks,mats){
 const c=coord(p.nucleo),v=vice(p.nucleo),ct=contactFor(p),m=meta(p.nucleo);
 const equipeCoord=p.papel==="Coordenador"?`<article class="card accent" style="--c:${m.c}"><div class="card-head"><div><span class="eyebrow">Núcleo</span><h3>Minha equipe</h3></div></div><ul class="mini">${peopleList(p.nucleo,p.nome)}</ul></article>`:"";
 $("#panel-cartao").innerHTML=`<div class="view-head"><h2>Meu cartão</h2><span>${show(p.papel)}</span></div><div class="grid">${renderPersonalCard(p,proofs,tasks,mats)}
 <article class="card accent" style="--c:${m.c}"><div class="card-head"><div><span class="eyebrow">Cadeia de responsabilidade</span><h3>Quem está comigo</h3></div></div>
 <div class="meta"><div class="field"><b>Coordenador</b><span>${c?esc(c.nome):"Pendente"}</span></div><div class="field"><b>Vice</b><span>${v?esc(v.nome):"Pendente"}</span></div><div class="field full"><b>Contato para dúvidas</b><span>${esc(ct.title)} · ${esc(ct.detail)}</span></div></div>
 ${defined(p.falta)&&String(p.falta).toLowerCase()!=="ok"?`<div class="action" style="--c:var(--terracota)"><b>Pendência pessoal</b><p>${esc(p.falta)}</p></div>`:""}</article>${equipeCoord}</div>`;
}
function teamNames(list){
 if(!defined(list))return "Pendente";
 if(list==="Todos")return "Equipe inteira";
 const a=String(list).split(",").map(x=>x.trim()).filter(Boolean);
 if(a.length<=4)return esc(a.join(", "));
 return `<details><summary>Ver equipe da prova</summary><div class="detail"><div>${a.map(esc).join("<br>")}</div></div></details>`;
}
function proofCard(pr,p){
 const m=meta(pr.nucleo),roles=proofRoles(pr,p),pm=proofMats(pr,p);
 const pend=defined(pr.pendencia)&&!["ok","—"].includes(String(pr.pendencia));
 return `<article class="card accent ${pend?"pend":""}" style="--c:${m.c};--on:${m.on}">
 <div class="card-head"><div><span class="eyebrow">${show(pr.nucleo)}</span><h3>${esc(pr.prova)}</h3><div class="tags">${roles.map(x=>`<span class="tag strong" style="--c:${m.c};--on:${m.on}">${esc(x)}</span>`).join("")}${pend?`<span class="tag warn">${esc(pr.pendencia)}</span>`:""}</div></div></div>
 <div class="meta"><div class="field"><b>Dia / turno</b><span>${show(pr.turno)}</span></div><div class="field"><b>Hora</b><span>${show(pr.hora)}</span></div><div class="field"><b>Prazo interno</b><span>${show(pr.prazo)}</span></div><div class="field"><b>Pronto até</b><span>${show(pr.pronto)}</span></div><div class="field full"><b>Local</b><span>${show(pr.local)}</span></div></div>
 <div class="action" style="--c:${m.c}"><b>O que fazer</b><p>${show(pr.acao)}</p></div>
 <div class="action" style="--c:${m.c}"><b>O que eu levo</b><p>${pm.length?pm.map(x=>esc(x.item)).join(" · "):"Não definido para você"}</p></div>
 <details><summary>Com quem e responsáveis</summary><div class="detail"><div><b>Responsável</b>${show(pr.responsavel)}</div><div><b>Substituto</b>${show(pr.substituto)}</div><div><b>Participantes</b>${teamNames(pr.participantes)}</div><div><b>Conferente</b>${show(pr.conferente)}</div></div></details>
 ${(defined(pr.riscos)||defined(pr.planoB))?`<details><summary>Atenção e plano B</summary><div class="detail">${defined(pr.riscos)?`<div><b>Atenção</b>${esc(pr.riscos)}</div>`:""}${defined(pr.planoB)?`<div><b>Plano B</b>${esc(pr.planoB)}</div>`:""}</div></details>`:""}
 </article>`;
}
function renderProofs(p,proofs){
 const shifts=personalShifts(p);
 const shiftHtml=shifts.length?`<section><span class="eyebrow">Cobertura do QG</span><div class="grid">${shifts.map(s=>`<article class="card accent" style="--c:var(--terracota)"><div class="card-head"><div><span class="eyebrow">${esc(shiftRole(s,p))}</span><h3>${esc(s.dia)} · ${esc(s.turno)}</h3></div></div><div class="meta"><div class="field"><b>Horário</b><span>${show(s.horario)}</span></div><div class="field"><b>Situação do turno</b><span>${show(s.situacao)}</span></div><div class="field"><b>Adulto responsável</b><span>${show(s.adulto)}</span></div><div class="field"><b>Professor</b><span>${show(s.professor)}</span></div></div></article>`).join("")}</div></section>`:"";
 $("#panel-provas").innerHTML=`<div class="view-head"><h2>Minhas provas e compromissos</h2><span>${show(p.nucleo)}</span></div>${proofs.length?`<div class="stack">${proofs.map(x=>proofCard(x,p)).join("")}</div>`:`<div class="empty"><strong>Pendente.</strong><p>Nenhuma prova está atribuída ao seu nome.</p></div>`}${shiftHtml}`;
}
function taskCard(t){
 const warn=String(t.situacao||"").toLowerCase()==="atrasada";
 return `<article class="card ${warn?"pend":""}"><div class="card-head"><div><span class="eyebrow">${show(t.fase)}</span><h3>${esc(t.item)}</h3></div>${warn?`<span class="tag warn">${esc(t.situacao)}</span>`:""}</div>
 <div class="meta"><div class="field"><b>Prazo interno</b><span>${show(t.prazo)}</span></div><div class="field"><b>Prazo oficial</b><span>${show(t.oficial)}</span></div><div class="field full"><b>Critério de pronto</b><span>${show(t.criterio)}</span></div></div>
 ${defined(t.planoB)?`<div class="action" style="--c:var(--terracota)"><b>Plano B</b><p>${esc(t.planoB)}</p></div>`:""}</article>`;
}
function matCard(m,p){
 const mta=meta(m.nucleo),roles=[m.traz===p.nome?"Você traz":null,m.transporta===p.nome?"Você transporta":null].filter(Boolean);
 return `<article class="card accent" style="--c:${mta.c}"><div class="card-head"><div><span class="eyebrow">${esc(m.prova)}</span><h3>${esc(m.item)}</h3><div class="tags">${roles.map(x=>`<span class="tag strong" style="--c:${mta.c};--on:${mta.on}">${x}</span>`).join("")}</div></div></div>
 <div class="meta"><div class="field"><b>Dia / turno</b><span>${show(m.turno)}</span></div><div class="field"><b>Quantidade</b><span>${defined(m.qtd)?esc(m.qtd):"Não definida"}</span></div><div class="field"><b>Obrigatoriedade</b><span>${show(m.obrigatoriedade)}</span></div><div class="field"><b>Status</b><span>${show(m.status)}</span></div></div>
 ${defined(m.pendencia)&&m.pendencia!=="ok"?`<div class="action" style="--c:var(--terracota)"><b>Pendência</b><p>${esc(m.pendencia)}</p></div>`:""}</article>`;
}
function renderTasks(p,tasks,mats){
 $("#panel-tarefas").innerHTML=`<div class="view-head"><h2>Tarefas e materiais</h2><span>${show(p.papel)}</span></div>
 <div class="stack"><section><span class="eyebrow">Tarefas e prazos</span>${tasks.length?`<div class="stack">${tasks.map(taskCard).join("")}</div>`:`<div class="empty"><strong>Não definido.</strong><p>Nenhuma tarefa individual ou de função está atribuída ao seu nome.</p></div>`}</section>
 <section><span class="eyebrow">Materiais sob minha responsabilidade</span>${mats.length?`<div class="grid">${mats.map(x=>matCard(x,p)).join("")}</div>`:`<div class="empty"><strong>Não definido.</strong><p>Nenhum material tem seu nome em “Quem traz” ou “Quem transporta”.</p></div>`}</section></div>`;
}
function contactRow(p){return `<li><strong>${esc(p.nome)}</strong><small>${esc(p.papel)} · ${esc(p.contato||"Contato não definido")}</small></li>`}
function renderTeam(p){
 const m=meta(p.nucleo);
 $("#panel-equipe").innerHTML=`<div class="view-head"><h2>Equipe</h2><span>Sete Povos das Missões</span></div><div class="grid">
 <article class="card accent" style="--c:${m.c}"><div class="card-head"><div><span class="eyebrow">Funcionamento</span><h3>Como a equipe trabalha</h3></div></div><ul class="mini"><li><strong>Seis núcleos</strong><small>Cada prova pertence a um núcleo e cada núcleo organiza suas entregas.</small></li><li><strong>Função ≠ núcleo</strong><small>A função define o papel; o núcleo define a área de trabalho.</small></li><li><strong>Regra operacional</strong><small>Integrante executa, confirma presença, leva o material assumido e avisa impedimentos.</small></li></ul></article>
 <article class="card"><div class="card-head"><div><span class="eyebrow">Decisão</span><h3>Fluxo</h3></div></div><p class="team-flow">Integrante → Coordenador → Capatazes</p><p>A Central registra, cobra confirmação e aponta conflitos. Em risco imediato de acidente, procure o professor ou responsável presente.</p></article>
 <article class="card"><div class="card-head"><div><span class="eyebrow">Comando</span><h3>Capatazes</h3></div></div><ul class="mini">${caps().map(contactRow).join("")}</ul></article>
 <article class="card"><div class="card-head"><div><span class="eyebrow">Grito de guerra</span><h3>Equipe 2</h3></div></div>${Array.isArray(DATA.event.grito)?DATA.event.grito.map(g=>`<p class="war">${esc(g)}</p>`).join(""):`<p class="war">${DATA.event.grito?esc(DATA.event.grito):"Pendente"}</p>`}</article>
 </div>`;
}
function render(p){
 current=p; const proofs=personalProofs(p),tasks=personalTasks(p),mats=personalMats(p);
 quick(p,proofs,tasks,mats); renderCardTab(p,proofs,tasks,mats); renderProofs(p,proofs); renderTasks(p,tasks,mats); renderTeam(p);
}
const select=$("#personSelect");
people.slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")).forEach(p=>{const o=document.createElement("option");o.value=p.nome;o.textContent=p.nome;select.appendChild(o)});
select.addEventListener("change",()=>{const p=person(select.value);$("#emptyState").hidden=!!p;$("#content").hidden=!p;if(p){activate("cartao");render(p)}});
function activate(name){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===name)));document.querySelectorAll(".panel").forEach(p=>p.hidden=p.id!==`panel-${name}`)}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>activate(b.dataset.tab)));
</script>
</body></html>
